 if(/(login|verify|secure|update|account|banking|wallet|kyc|confirm|suspend|password|otp|refund|prize|free)/.test(h+u.pathname))add(20,'⚠️ Sensitive/urgent keywords in the link');
 const br=['paypal','amazon','google','microsoft','apple','netflix','facebook','instagram','whatsapp','sbi','hdfc','icici','paytm','phonepe','gpay','flipkart'];br.forEach(b=>{const root=parts.slice(-2).join('.');if(h.includes(b)&&!root.startsWith(b+'.'))add(40,'🚩 Imitates brand "'+b+'" but the real domain is '+esc(root))});
 if(h.split('-').length>3)add(15,'⚠️ Many hyphens in domain');if(raw.length>120)add(10,'⚠️ Very long URL');if(u.port&&!['80','443'].includes(u.port))add(15,'⚠️ Unusual port '+u.port);

const FR=[[/otp|one.?time|cvv|pin\b|card number/i,'Asks for OTP/PIN/card details. Legit companies never do this',45],[/urgent|immediately|within \d+ ?(hours|hrs|minutes)|last chance|act now|expires? (today|soon)/i,'Creates false urgency',20],[/(account|card|sim|number|upi|wallet)[^.]{0,30}(blocked|suspended|deactivated|frozen|closed)/i,'Threatens account blocking',30],[/kyc|pan (card )?(update|verify)|aadhaar|verify your (identity|account)/i,'KYC/identity update bait',30],[/lottery|you (have )?won|prize|winner|jackpot|reward points|cashback claim/i,'Prize/lottery bait',35],[/gift ?card|itunes|bitcoin|crypto|wire transfer|western union/i,'Untraceable payment request',30],[/work from home|earn \₹?\$?\d+|per (day|hour)|part.?time job|like (and )?subscribe.*earn/i,'Fake job / easy money offer',30],[/refund|tax (return|refund)|electricity (bill|will be)|disconnect/i,'Refund / utility disconnection scam',25],[/(https?:\/\/|www\.|bit\.ly|t\.co)\S+/i,'Contains a link. Verify it in Link Analysis',15],[/(police|cbi|customs|narcotics|court|arrest|parcel)/i,'Authority / "digital arrest" intimidation',35],[/(send|pay|transfer)[^.]{0,20}(₹|rs\.?|inr|\$|usd)\s?\d+/i,'Requests money transfer',25],[/dear (customer|user|sir|madam|winner)/i,'Generic greeting',10],[/anydesk|teamviewer|quicksupport|remote (access|support)/i,'Requests remote-access app',45]];
function vFraud(){M(`<div class="g card"><h2>🚨 Fraud Message Detector</h2><p class="mu">Paste an SMS, WhatsApp, email or call script.</p><textarea id="fm" rows="6" placeholder="Paste the suspicious message here…"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="runFraud()">Detect Fraud</button></div></div><div id="fr"></div>`)}
function runFraud(){const t=$('fm').value;if(!t.trim())return;let s=0;const it=[];FR.forEach(r=>{if(r[0].test(t)){s+=r[2];it.push('🚩 '+r[1])}});
 if(s>=25)it.push('👉 Do not reply, click or pay. Block the sender. Report at cybercrime.gov.in or call 1930 (India).');me.scans++;saveMe();$('fr').innerHTML=verdict(s,it,'Message result')}

function vIoc(){M(`<div class="g card"><h2>🧪 IOC Extractor</h2><p class="mu">Paste logs, email headers or a threat report. IPs, domains, URLs, hashes, emails and CVEs are pulled out <b>on your device only</b>, and shown defanged so nobody clicks them by mistake.</p><textarea id="ii" rows="8" placeholder="Paste text here…"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="runIoc()">Extract</button><button class="btn s" onclick="$('ii').value='';$('ir').innerHTML=''">Clear</button></div></div><div id="ir"></div>`)}
const defang=v=>v.replace(/^http/i,'hxxp').replace(/\./g,'[.]').replace(/@/g,'[@]'),privIP=v=>/^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.|0\.)/.test(v);
let IOCS=null;
function runIoc(){const t=$('ii').value;if(!t.trim())return;const u=a=>[...new Set(a||[])];
 const urls=u(t.match(/\bh(?:tt|xx)ps?:\/\/[^\s"'<>)\]]+/gi)).map(x=>x.replace(/[.,;]+$/,'')),
  ips=u(t.match(/\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/g)),
  hashes=u(t.match(/\b(?:[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\b/gi)).map(x=>x.toLowerCase()),
  mails=u(t.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)),cves=u((t.match(/\bCVE-\d{4}-\d{4,7}\b/gi)||[]).map(x=>x.toUpperCase()));
 const skip=/\.(exe|dll|txt|log|js|css|png|jpe?g|gif|pdf|docx?|xlsx?|zip|bat|ps1|sh|py|json|xml|html?|php|asp|tmp|dat|sys|ini|cfg|md)$/i,ipRe=/^\d{1,3}(\.\d{1,3}){3}$/;
 const hostOf=x=>{try{return new URL(x.replace(/^hxxp/i,'http')).hostname}catch{return''}};
 const doms=u([...(t.match(/\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}\b/gi)||[]).map(x=>x.toLowerCase()),...urls.map(hostOf)]).filter(x=>x&&!ipRe.test(x)&&!skip.test(x));
 const G=[['🌐 URLs',urls.map(defang)],['📍 IP addresses',ips.map(x=>defang(x)+(privIP(x)?'  (private)':''))],['🔗 Domains',doms.map(defang)],['🔑 Hashes',hashes],['✉️ Emails',mails.map(defang)],['🐞 CVEs',cves]].filter(g=>g[1].length);
 IOCS=G;const n=G.reduce((a,g)=>a+g[1].length,0);
 $('ir').innerHTML=n?`<div class="g card"><div class="row"><h2>${n} indicators found</h2><span style="flex:1"></span><button class="btn s" onclick="cpIoc(this)">📋 Copy all</button><button class="btn" onclick="askIoc()">🤖 Analyse with AI</button></div>`+G.map(g=>`<h3 style="margin:14px 0 6px">${g[0]} <span class="tag">${g[1].length}</span></h3>`+g[1].map(x=>`<div class="it"><code style="word-break:break-all">${esc(x)}</code></div>`).join('')).join('')+'</div>':'<div class="g card">No indicators found in this text.</div>'}
const iocText=()=>(IOCS||[]).map(g=>g[0]+'\n'+g[1].join('\n')).join('\n\n');

function vPw(){M(`<div class="g card"><h2>🔑 Password Checker</h2><input id="pi" placeholder="Type a password to test (never sent anywhere)" oninput="chkPw()"><div class="bar"><i id="pb" style="width:0"></i></div><div id="pr" class="mu"></div></div><div class="g card"><h2>🎲 Password Generator</h2><div class="row"><label>Length <input id="pl" type="range" min="8" max="64" value="18" oninput="$('plv').textContent=this.value" style="width:150px"> <b id="plv">18</b></label><label><input type="checkbox" id="ps" checked style="width:auto"> Symbols</label><label><input type="checkbox" id="pp" style="width:auto"> Passphrase</label></div><div class="row" style="margin:10px 0"><button class="btn" onclick="genPw()">Generate</button><button class="btn s" onclick="navigator.clipboard&&navigator.clipboard.writeText($('po').value)">Copy</button></div><input id="po" readonly style="font-family:monospace"></div>`);genPw()}
function chkPw(){const p=$('pi').value;let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^\w]/.test(p))pool+=32;let bits=p.length*Math.log2(pool||1);const it=[];
 if(/^(password|123456|qwerty|admin|letmein|welcome|iloveyou|abc123|111111)/i.test(p)){bits=Math.min(bits,15);it.push('🚩 Very common password')}
 if(/(.)\1{2,}/.test(p)){bits-=8;it.push('⚠️ Repeated characters')}if(/(0123|1234|2345|abcd|qwer)/i.test(p)){bits-=10;it.push('⚠️ Predictable sequence')}
 if(p&&p.length<12)it.push('⚠️ Use 12+ characters');bits=Math.max(0,bits);$('pb').style.width=Math.min(100,bits/80*100)+'%';
 const g=Math.pow(2,bits)/1e10,t=g<1?'instantly':g<60?Math.round(g)+' seconds':g<3600?Math.round(g/60)+' minutes':g<86400?Math.round(g/3600)+' hours':g<3.15e7?Math.round(g/86400)+' days':g<3.15e9?Math.round(g/3.15e7)+' years':'centuries+';
 $('pr').innerHTML=p?`Entropy ≈ ${Math.round(bits)} bits · offline crack time ≈ <b>${t}</b>`+it.map(x=>'<div class="it">'+x+'</div>').join(''):''}
function genPw(){const n=+$('pl').value,r=x=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%x};let o='';
 if($('pp').checked){const W='amber,anchor,badger,breeze,cactus,canyon,comet,dragon,ember,falcon,forest,glacier,harbor,island,jungle,kernel,lantern,meadow,nebula,orchid,pebble,quartz,raven,saffron,thunder,velvet,willow,zephyr,cobalt,crimson,marble,tundra'.split(',');o=[0,1,2,3].map(()=>W[r(W.length)]).join('-')+'-'+(10+r(90))}
 else{const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'+($('ps').checked?'!@#$%^&*-_+=?':'');for(let i=0;i<n;i++)o+=c[r(c.length)]}$('po').value=o}
function vTools(){M(`<div class="g card"><h2>🧰 Hash &amp; Encode Tools</h2><textarea id="ti" rows="4" placeholder="Enter text…"></textarea><div class="row" style="margin:10px 0"><button class="btn s" onclick="hs('SHA-1')">SHA-1</button><button class="btn s" onclick="hs('SHA-256')">SHA-256</button><button class="btn s" onclick="hs('SHA-512')">SHA-512</button><button class="btn s" onclick="out(btoa(unescape(encodeURIComponent($('ti').value))))">Base64 ⬆</button><button class="btn s" onclick="try{out(decodeURIComponent(escape(atob($('ti').value.trim()))))}catch(e){out('Invalid Base64')}">Base64 ⬇</button><button class="btn s" onclick="out(encodeURIComponent($('ti').value))">URL encode</button></div><textarea id="to" rows="4" readonly placeholder="Result"></textarea></div>`)}
const out=v=>$('to').value=v;async function hs(a){out([...new Uint8Array(await crypto.subtle.digest(a,new TextEncoder().encode($('ti').value)))].map(b=>b.toString(16).padStart(2,'0')).join(''))}
